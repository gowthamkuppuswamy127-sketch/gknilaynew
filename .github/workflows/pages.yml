# Publishes the static site to GitHub Pages.
#
# This does nothing until Pages is switched on:
#   Settings → Pages → Source: "GitHub Actions"
# Until then the workflow simply never runs a deployment.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if draft mode is still on
        run: |
          if grep -l 'data-draft="true"' ./*.html >/dev/null 2>&1; then
            echo "::error::Placeholder content is still live (data-draft=\"true\")."
            echo "Work through CONTENT-TODO.md, then set data-draft=\"false\" in all four pages."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Package the site
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -r assets _site/
          # Docs and tooling are not part of the published site.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
